<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; touch-action: pan-y; }   /* në telefon: rrëshqitja lart-poshtë lëviz faqen, anash rrotullon */
  .tag { position: absolute; transform: translate(-50%, 0); text-align: center; pointer-events: none; white-space: nowrap; }
  .tag b { display: block; color: #e8eefc; font-size: 13px; letter-spacing: .3px; text-shadow: 0 0 8px #000; }
  .tag span { display: inline-block; margin-top: 3px; padding: 1px 8px; border-radius: 9px; font-size: 11px; color: #05070f; font-weight: 600; }
  #hint { position: absolute; right: 12px; bottom: 8px; color: #5b6b8c; font-size: 11px; }
</style>
</head>
<body>
<div id="wrap"><div id="hint">tërhiq për ta rrotulluar</div></div>
<script>__THREE__</script>
<script>
const STATE = __STATE__;   // [{name, status}] status: idle | running | passed | rejected | alert | error
const COLORS = { idle: 0x3a4766, running: 0xffc94d, passed: 0x37e29b, rejected: 0xff5468, alert: 0x4dc3ff, error: 0xff8a3d };
const LABEL = { idle: "në pritje", running: "po punon…", passed: "e kaloi", rejected: "refuzoi", alert: "ALARM", error: "gabim" };
const ACCENT = [0x4dc3ff, 0xb57bff, 0xffc94d, 0x37e29b, 0xff5468, 0x4dffd8];

const wrap = document.getElementById("wrap");
const W = () => wrap.clientWidth, H = () => wrap.clientHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070f, 18, 40);
const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 100);

scene.add(new THREE.HemisphereLight(0xb8ccff, 0x1a2036, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(6, 12, 8); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
scene.add(key);

// Dyshemeja: disk i errët me rrjetë drite
const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64),
  new THREE.MeshStandardMaterial({ color: 0x0a0f1e, metalness: 0.6, roughness: 0.45 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.PolarGridHelper(15, 24, 10, 64, 0x1d2b4f, 0x121a33);
grid.position.y = 0.01; scene.add(grid);

// Robotët në hark
const N = STATE.length, R = 8.5, ARC = Math.PI * 0.95;
const robots = [], tags = [];
// Në telefon (ekran i ngushtë) robotët rreshtohen zigzag drejt thellësisë; në kompjuter, në hark.
const NARROW = W() / H() < 1.1;
const pos = i => {
  if (NARROW) return new THREE.Vector3(i % 2 ? 2.4 : -2.4, 0, 5 - i * 2.7);
  const a = -ARC / 2 + ARC * i / (N - 1); return new THREE.Vector3(Math.sin(a) * R, 0, -Math.cos(a) * R + R * 0.55);
};

function makeRobot(i, st) {
  const g = new THREE.Group();
  const color = COLORS[st.status] ?? COLORS.idle;
  const metal = new THREE.MeshStandardMaterial({ color: 0xe3e9f7, metalness: 0.3, roughness: 0.32 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a2236, metalness: 0.7, roughness: 0.35 });
  const glow = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: st.status === "idle" ? 0.25 : 1.4 });
  const accent = new THREE.MeshStandardMaterial({ color: ACCENT[i], emissive: ACCENT[i], emissiveIntensity: 0.6, metalness: 0.4, roughness: 0.3 });

  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.3, 0.25, 40), dark); base.position.y = 0.125;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.05, 12, 60), glow); ring.rotation.x = Math.PI / 2; ring.position.y = 0.27;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.78, 1.25, 32), metal); body.position.y = 1.0;
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.36, 0.08), accent); chest.position.set(0, 1.1, 0.7);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.2, 16), dark); neck.position.y = 1.72;
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.8, 0.9), metal); head.position.y = 2.2;
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.32, 0.05), dark); visor.position.set(0, 2.25, 0.46);
  const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
  const eyeL = new THREE.Mesh(eyeGeo, glow); eyeL.position.set(-0.22, 2.25, 0.5);
  const eyeR = new THREE.Mesh(eyeGeo, glow); eyeR.position.set(0.22, 2.25, 0.5);
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.45, 8), dark); ant.position.y = 2.82;
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), glow); bulb.position.y = 3.07;
  const armGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.9, 16);
  const armL = new THREE.Mesh(armGeo, accent); armL.position.set(-0.9, 1.05, 0); armL.rotation.z = 0.18;
  const armR = new THREE.Mesh(armGeo, accent); armR.position.set(0.9, 1.05, 0); armR.rotation.z = -0.18;
  [base, body, head, armL, armR].forEach(m => { m.castShadow = true; });
  g.add(base, ring, body, chest, neck, head, visor, eyeL, eyeR, ant, bulb, armL, armR);

  const light = new THREE.PointLight(color, st.status === "idle" ? 0.15 : 1.4, 5);
  light.position.y = 1.5; g.add(light);

  const p = pos(i); g.position.copy(p);
  g.lookAt(new THREE.Vector3(0, 0, R * 2.2));
  scene.add(g);
  robots.push({ g, head, bulb, ring, st, phase: i * 0.7 });

  const tag = document.createElement("div"); tag.className = "tag";
  const hex = "#" + color.toString(16).padStart(6, "0");
  tag.innerHTML = `<b>${i + 1}. ${st.name}</b><span style="background:${hex}">${LABEL[st.status] || st.status}</span>`;
  wrap.appendChild(tag); tags.push({ tag, p });
}
STATE.forEach((s, i) => makeRobot(i, s));

// Rrezet e dritës mes robotëve, me grimca që udhëtojnë kur grafiku kalon
const pulses = [];
for (let i = 0; i < N - 1; i++) {
  const a = pos(i).add(new THREE.Vector3(0, 1.1, 0)), b = pos(i + 1).add(new THREE.Vector3(0, 1.1, 0));
  const done = ["passed", "alert"].includes(STATE[i].status);
  const col = done ? COLORS.passed : 0x24324f;
  const mid = a.clone().lerp(b, 0.5); mid.y += 0.9;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, done ? 0.04 : 0.025, 8, false),
    new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: done ? 1.2 : 0.3, transparent: true, opacity: done ? 0.95 : 0.5 }));
  scene.add(tube);
  if (done || STATE[i + 1].status === "running") {
    for (let k = 0; k < 3; k++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12),
        new THREE.MeshBasicMaterial({ color: STATE[i + 1].status === "running" ? COLORS.running : COLORS.passed }));
      scene.add(s); pulses.push({ s, curve, off: k / 3 });
    }
  }
}

// Kamera me rrotullim nga miu / gishti
let yaw = 0, pitch = NARROW ? 0.6 : 0.36, dist = NARROW ? 23 : 17, drag = null, idleT = 0;
const target = NARROW ? new THREE.Vector3(0, 0.3, -2.2) : new THREE.Vector3(0, 1.6, 2.2);
renderer.domElement.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; idleT = 0; });
addEventListener("pointerup", () => drag = null);
addEventListener("pointermove", e => {
  if (!drag) return;
  yaw -= (e.clientX - drag.x) * 0.006; pitch = Math.min(1.2, Math.max(0.12, pitch + (e.clientY - drag.y) * 0.004));
  drag = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener("wheel", e => { e.preventDefault(); dist = Math.min(32, Math.max(11, dist + e.deltaY * 0.01)); }, { passive: false });

const fit = () => { renderer.setSize(W(), H()); camera.aspect = W() / H(); camera.updateProjectionMatrix(); };
addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap);   // iframe-i merr lartësinë e plotë pak më vonë

const clock = new THREE.Clock(), v = new THREE.Vector3();
(function loop() {
  const t = clock.getElapsedTime(), dt = clock.getDelta();
  if (!drag) { idleT += 1 / 60; if (idleT > 3) yaw += Math.sin(t * 0.15) * 0.0012; }
  const d = dist * Math.max(1, (NARROW ? 0.75 : 2.1) / camera.aspect);   // në ekrane të ngushta kamera largohet, që të shihen të 6
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * d, target.y + Math.sin(pitch) * d,
                      target.z + Math.cos(yaw) * Math.cos(pitch) * d);
  camera.lookAt(target);

  robots.forEach(r => {
    const s = r.st.status;
    r.g.position.y = s === "running" ? Math.abs(Math.sin(t * 5)) * 0.35 : Math.sin(t * 1.4 + r.phase) * 0.06;
    r.head.rotation.y = s === "running" ? Math.sin(t * 3) * 0.5 : s === "rejected" ? Math.sin(t * 6) * 0.08 : Math.sin(t * 0.6 + r.phase) * 0.15;
    r.bulb.scale.setScalar(1 + (s === "idle" ? 0 : 0.35 * (0.5 + 0.5 * Math.sin(t * 6))));
    r.ring.rotation.z = t * (s === "running" ? 3 : 0.4);
  });
  pulses.forEach(p => p.s.position.copy(p.curve.getPoint((t * 0.45 + p.off) % 1)));

  tags.forEach(({ tag, p }) => {
    v.copy(p); v.y += 3.9; v.project(camera);
    tag.style.left = ((v.x + 1) / 2 * W()) + "px"; tag.style.top = ((1 - v.y) / 2 * H()) + "px";
    tag.style.opacity = v.z < 1 ? 1 : 0;
  });
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
